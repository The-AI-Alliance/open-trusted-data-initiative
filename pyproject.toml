[project]
name = "open-trusted-data-initiative"
version = "0.2.0"
description = "Project to catalog the world's open data sets."
authors = [
    {name = "The AI Alliance",email = "data@thealliance.ai"}
]
license = {text = "Apache License Version 2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.3",
    "pyshp>=3.1.6",
    "ipykernel>=7.3.0",
    "bokeh>=3.8.2",
    "duckdb>=1.5.5",
    "tqdm>=4.67.1",
    "psutil>=7.0.0",
    "pyarrow>=25.0.1",
    "urllib3>=2.6.3",
    "setuptools>=83.0.0",
    "huggingface-hub>=1.32.0",
    "requests>=2.34.2",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "fastparquet>=2026.5.0",
    "boto3>=1.43.97",
    "awswrangler>=3.17.1",
    "aiohttp>=3.14.3",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "aws-cdk-lib>=2.270.0",
    "constructs>=10.8.1",
    "fastmcp>=4.0.5",
]


[project.optional-dependencies]
dev = [
    "hypothesis>=6.165.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pylint>=4.0.7",
    "black[jupyter]>=26.5.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

